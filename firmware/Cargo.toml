[package]
name = "pico-keeb-firmware"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "RP2040-Zero firmware for pico-keeb (Embassy)"

[[bin]]
name = "pico-keeb-firmware"
path = "src/main.rs"

[features]
# bInterval = 1 ms on every HID endpoint. For desktop xHCI hosts only —
# causes dwc2 scheduler errors on Cyclone V USB (MiSTer / Pi) through a hub.
low-latency = []
# Strip to a single keyboard HID interface and bump bInterval to 16 ms.
# Use for MiSTer FPGA where dwc2's split-transaction scheduler trips on
# multiple concurrently-polled interrupt-IN endpoints.
mister = []

[dependencies]
pico-keeb-protocol = { path = "../protocol" }

embassy-executor = { version = "0.7", features = [
    "arch-cortex-m",
    "executor-thread",
    "task-arena-size-32768",
    "defmt",
] }
embassy-rp = { version = "0.5", features = [
    "rp2040",
    "time-driver",
    "critical-section-impl",
    "defmt",
    "rt",
    "unstable-pac",
] }
embassy-time = { version = "0.4", features = ["defmt"] }
embassy-usb = { version = "0.4", features = ["defmt"] }
embassy-sync = { version = "0.7", features = ["defmt"] }
embassy-futures = "0.1"

usbd-hid = "0.8"
embedded-io-async = "0.6"

static_cell = "2"
heapless = "0.8"
smart-leds = "0.4"

cortex-m = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"

defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }

portable-atomic = { version = "1", features = ["critical-section"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
debug = 2
overflow-checks = false

[profile.dev]
opt-level = 1
debug = 2
overflow-checks = true
